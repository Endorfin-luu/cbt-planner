<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kioku — 間隔反復フラッシュカード</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kioku">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- GitHub Pages 版はクラウド保存に CBT Planner と同じ Firebase を使う（claude.ai 版は claude.use("db")） -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f0; --surface:#ffffff; --surface2:#faf9f6; --ink:#1c1c1e; --ink2:#4f5056; --muted:#86878d; --line:#e2e0da;
  --accent:#2160c4; --accent-ink:#ffffff; --accent-soft:#e6eefb;
  --new:#2160c4; --learn:#c2352c; --rev:#1d7f47;
  --again:#c2352c; --hard:#5e636b; --good:#1d7f47; --easy:#2160c4;
  --cloze:#2160c4; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-head:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --bar:#3a74d0;
}
[data-theme="dark"]{
  --bg:#141518; --surface:#1f2024; --surface2:#26272c; --ink:#ebebee; --ink2:#b9bac0; --muted:#85868d; --line:#34353b;
  --accent:#6ea0f0; --accent-ink:#0d1a2e; --accent-soft:#1f2b40;
  --new:#7aa8f5; --learn:#f07b72; --rev:#5cc489;
  --again:#f07b72; --hard:#a0a4ab; --good:#5cc489; --easy:#7aa8f5;
  --cloze:#7aa8f5; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --bar:#6c9ce8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
h1,h2,h3{font-family:var(--f-head);font-weight:700;margin:0 0 .6em;line-height:1.35}
h1{font-size:1.5rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:6px 12px;flex-wrap:wrap}
.brand{font-family:var(--f-head);font-weight:700;font-size:1.15rem;margin-right:12px;display:flex;align-items:center;gap:8px;cursor:pointer}
.brand .logo{width:24px;height:24px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav button{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--ink2)}
.nav button:hover{background:var(--surface2)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.sync{margin-left:auto;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok .dot{background:var(--rev)} .sync.err .dot{background:var(--learn)} .sync.busy .dot{background:#d89a1d}
main{max-width:980px;margin:0 auto;padding:20px 16px 120px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--learn);border-color:color-mix(in srgb,var(--learn) 40%,var(--line))}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{border:0;background:none;cursor:pointer;padding:4px 8px;border-radius:7px;color:var(--ink2)}
.iconbtn:hover{background:var(--surface2)}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input:focus,select:focus,textarea:focus,.field:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0}
label.lbl{display:block;font-size:.82rem;color:var(--ink2);margin:10px 0 4px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:.85rem}
.n{color:var(--new)} .l{color:var(--learn)} .r{color:var(--rev)}
/* deck list */
.decks{width:100%;border-collapse:collapse}
.decks th{font-weight:700;font-size:.8rem;color:var(--muted);text-align:right;padding:6px 10px;border-bottom:1px solid var(--line)}
.decks th:first-child{text-align:left}
.decks td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.decks td:first-child{text-align:left}
.decks tr:last-child td{border-bottom:0}
.decks .dname{cursor:pointer;font-weight:700}
.decks .dname:hover{color:var(--accent)}
.decks .zero{color:var(--muted);opacity:.5}
.tog{display:inline-block;width:18px;cursor:pointer;color:var(--muted);user-select:none}
/* study */
.study{display:flex;flex-direction:column;min-height:calc(100vh - 200px)}
.counts{text-align:center;font-weight:700;font-size:1rem;margin-bottom:10px;font-variant-numeric:tabular-nums}
.counts span{margin:0 8px;padding-bottom:2px}
.counts span.cur{border-bottom:2px solid currentColor}
.cardbox{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px 22px;font-size:1.3rem;line-height:1.75;text-align:center;overflow-wrap:anywhere;position:relative}
.cardbox img{max-width:100%;height:auto;border-radius:6px}
.cardbox hr#answer{border:0;border-top:1px solid var(--line);margin:22px 0}
.cardbox .extra{font-size:1.05rem;color:var(--ink2);margin-top:18px}
.cardbox ul,.cardbox ol{text-align:left;display:inline-block}
.cardbox table{margin:0 auto;border-collapse:collapse}
.cardbox td,.cardbox th{border:1px solid var(--line);padding:4px 8px}
.cloze{color:var(--cloze);font-weight:700}
.flagbar{position:absolute;top:0;left:0;right:0;height:5px;border-radius:16px 16px 0 0}
.markstar{position:absolute;top:10px;right:14px;color:#d39a12;font-size:1.1rem}
.typein{margin-top:16px;width:min(100%,420px);font-size:1.1rem;text-align:center;padding:8px}
.diff .ok{color:var(--good)} .diff .bad{color:var(--again);text-decoration:line-through} .diff .miss{color:var(--easy);background:var(--accent-soft)}
.answerbar{position:sticky;bottom:0;padding:14px 0 6px;background:linear-gradient(transparent,var(--bg) 30%);display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.ease{min-width:96px;border:0;border-radius:11px;padding:8px 14px 9px;cursor:pointer;color:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.ease small{font-weight:400;font-size:.78rem;opacity:.92}
.ease.e1{background:var(--again)} .ease.e2{background:var(--hard)} .ease.e3{background:var(--good)} .ease.e4{background:var(--easy)}
[data-theme="dark"] .ease{color:#111}
.ease:hover{filter:brightness(1.08)}
.showbtn{min-width:240px;padding:12px 20px;font-size:1.05rem}
.studytools{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.kbd{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px}
/* editor */
.editor .fieldname{font-size:.82rem;color:var(--ink2);font-weight:700;margin:12px 0 4px;display:flex;align-items:center;gap:8px}
.editor .field{min-height:70px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:1.05rem;overflow-wrap:anywhere}
.editor .field img{max-width:240px;height:auto}
.editor .field .clz{color:var(--cloze)}
.toolbar{display:flex;gap:2px;flex-wrap:wrap;padding:4px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);margin-top:12px}
.toolbar button{border:0;background:none;min-width:32px;height:30px;border-radius:6px;cursor:pointer;color:var(--ink2)}
.toolbar button:hover{background:var(--surface)}
.toolbar .sep{width:1px;background:var(--line);margin:4px 3px}
.dup{color:var(--learn);font-size:.8rem;font-weight:400}
/* browse */
.btable{width:100%;border-collapse:collapse;font-size:.88rem}
.btable th{position:sticky;top:0;background:var(--surface2);text-align:left;padding:7px 8px;font-size:.78rem;color:var(--ink2);cursor:pointer;user-select:none;border-bottom:1px solid var(--line);white-space:nowrap}
.btable td{padding:7px 8px;border-bottom:1px solid var(--line);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btable tr{cursor:pointer}
.btable tr:hover td{background:var(--surface2)}
.btable tr.sel td{background:var(--accent-soft)}
.btable tr.susp td{color:var(--muted);font-style:italic}
.btable tr.f1 td:first-child{box-shadow:inset 4px 0 #d9483b}.btable tr.f2 td:first-child{box-shadow:inset 4px 0 #e08a1e}.btable tr.f3 td:first-child{box-shadow:inset 4px 0 #2f9e57}.btable tr.f4 td:first-child{box-shadow:inset 4px 0 #3a74d0}
.bwrap{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.browse-grid{display:grid;grid-template-columns:1fr;gap:14px}
.browse-grid>*{min-width:0}
@media(min-width:900px){ main.wide{max-width:1280px} .browse-grid.has-ed{grid-template-columns:1.25fr 1fr} .browse-grid.has-ed .bwrap{max-height:72vh} }
/* stats */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .v{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .k{font-size:.8rem;color:var(--ink2)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .axis{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--bar)}
.chart .bar.hl{fill:var(--accent)}
.chart .hit{fill:transparent;cursor:default}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:.8rem;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:5}
.legendrow{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stackbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface)}
.stackbar div{height:100%}
/* image occlusion editor */
.io-ed{margin-top:4px}
.io-stage{position:relative;display:inline-block;max-width:100%;user-select:none;-webkit-user-select:none;touch-action:none;outline:none;line-height:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface2)}
.io-stage:focus{border-color:var(--accent)}
.io-stage.empty{display:block;line-height:1.6;padding:34px 16px;text-align:center}
.io-stage img{display:block;max-width:100%;max-height:70vh;cursor:crosshair;-webkit-user-drag:none}
.io-box{position:absolute;background:rgba(242,135,92,.55);border:2px solid #c0502a;border-radius:3px;cursor:move;box-sizing:border-box}
.io-box span{position:absolute;top:2px;left:4px;font-size:12px;line-height:1;color:#fff;font-weight:700;text-shadow:0 0 2px #000;pointer-events:none}
.io-box.sel{border-color:#2160c4;background:rgba(33,96,196,.38)}
.io-box.drawing{border-style:dashed;pointer-events:none}
.progress{font-variant-numeric:tabular-nums}
.curve{margin-top:10px}
.curve .ln{fill:none;stroke:var(--bar);stroke-width:2}
.curve .tg{stroke:var(--muted);stroke-dasharray:4 4}
.curve .now{fill:var(--accent);stroke:var(--surface);stroke-width:2}
/* modal */
.mask{position:fixed;inset:0;background:rgba(10,10,14,.45);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:6vh 12px;overflow:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.25);width:min(560px,100%);padding:20px}
.modal.wide{width:min(820px,100%)}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:10px;z-index:200;font-size:.9rem;box-shadow:var(--shadow);transition:opacity .3s}
.menu{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:5px;z-index:120;min-width:170px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:7px;cursor:pointer}
.menu button:hover{background:var(--surface2)}
.menu button.danger{color:var(--learn)}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.88rem}
.tagchip{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:.78rem;margin-right:3px}
pre.preview{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.8rem;max-height:160px;overflow:auto;white-space:pre-wrap}
.revtable{width:100%;font-size:.82rem;border-collapse:collapse}
.revtable td,.revtable th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
.empty{text-align:center;padding:40px 10px}
@media(max-width:640px){
  main{padding:14px 10px 120px}
  .cardbox{padding:22px 14px;font-size:1.15rem}
  .ease{min-width:72px;padding:8px 8px}
  .sync .txt{display:none}
  .hide-sm{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand" data-go="decks"><span class="logo">記</span>Kioku</div>
  <nav class="nav" id="nav">
    <button data-go="decks">デッキ</button>
    <button data-go="drill">問題演習</button>
    <button data-go="add">追加</button>
    <button data-go="browse">閲覧</button>
    <button data-go="stats">統計</button>
    <button data-go="settings">設定</button>
  </nav>
  <div class="sync" id="sync" title=""><span class="dot"></span><span class="txt">このブラウザに保存</span></div>
</header>
<main id="view"></main>
<div class="tip" id="tip"></div>
<script src="pixel.js"></script>
<script src="game.js"></script>
<script>
"use strict";
/* ============================================================
   基本ユーティリティ
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const MIN = 60000, HOUR = 3600000, DAY = 86400000;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function h(tag, attrs={}, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()){ if (kid == null || kid === false) continue; el.append(kid.nodeType ? kid : document.createTextNode(kid)); }
  return el;
}
function hash32(str){ let x = 2166136261; for (let i=0;i<str.length;i++){ x ^= str.charCodeAt(i); x = Math.imul(x, 16777619); } return x >>> 0; }
function sanitize(html){
  const t = document.createElement("template"); t.innerHTML = html ?? "";
  t.content.querySelectorAll("script,style,iframe,object,embed,link,meta,base,form").forEach(e => e.remove());
  t.content.querySelectorAll("*").forEach(el => {
    for (const a of [...el.attributes]){
      const n = a.name.toLowerCase();
      if (n.startsWith("on") || ((n==="href"||n==="src"||n==="xlink:href"||n==="action") && /^\s*(javascript|vbscript):/i.test(a.value))) el.removeAttribute(a.name);
    }
    if (el.tagName === "IMG"){
      const src = el.getAttribute("src");
      if (src && !/^\s*(data:|blob:)/i.test(src) && !/^\/_blob\//.test(src)){
        el.removeAttribute("src");
        if (!/^[a-z][a-z0-9+.-]*:|^\/\//i.test(src)){ let nm = src; try { nm = decodeURIComponent(src); } catch(e){} el.setAttribute("data-media", nm); }
        else el.setAttribute("alt", "[外部の画像は表示できません]");
      }
    }
  });
  return t.innerHTML;
}
const plainCache = new Map();
function plain(html){
  if (!html) return "";
  let v = plainCache.get(html); if (v !== undefined) return v;
  const t = document.createElement("template"); t.innerHTML = String(html).replace(/<br\s*\/?>/gi," ").replace(/<\/(div|p|li)>/gi," ");
  v = (t.content.textContent || "").replace(/\s+/g," ").trim();
  if (plainCache.size > 20000) plainCache.clear();
  plainCache.set(html, v); return v;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function fmtIvl(ms){
  const m = ms / MIN;
  if (m < 1) return "1分未満";
  if (m < 60) return Math.round(m) + "分";
  const hr = m / 60; if (hr < 24) return (hr < 10 ? Math.round(hr*10)/10 : Math.round(hr)) + "時間";
  const d = hr / 24; if (d < 30) return Math.round(d) + "日";
  const mo = d / 30.4; if (mo < 12) return (Math.round(mo*10)/10) + "か月";
  return (Math.round(d/365*10)/10) + "年";
}
const fmtDays = d => fmtIvl(d * DAY);
function fmtDate(ts){ const d = new Date(ts); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; }
function fmtDateTime(ts){ const d = new Date(ts); return `${fmtDate(ts)} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function fmtDur(ms){ const s = Math.round(ms/1000); if (s < 60) return s + "秒"; const m = Math.floor(s/60); if (m < 60) return m + "分" + (s%60 ? (s%60)+"秒" : ""); return Math.floor(m/60) + "時間" + (m%60) + "分"; }

/* ============================================================
   状態
   ============================================================ */
const DEFAULT_OPTS = {
  newPerDay: 20, revPerDay: 200, learnSteps: [1, 10], graduatingIvl: 1, easyIvl: 4, startEase: 2.5,
  relearnSteps: [10], minIvl: 1, lapseMult: 0, easyBonus: 1.3, hardIvl: 1.2, ivlMod: 1.0, maxIvl: 36500,
  leechThreshold: 8, leechAction: "suspend", newOrder: "added", buryNew: false, buryRev: false,
  scheduler: "fsrs", desiredRetention: 0.9
};
const NOTE_TYPES = {
  basic:   { name: "基本", fields: ["表面", "裏面"] },
  reverse: { name: "基本（逆方向カード付き）", fields: ["表面", "裏面"] },
  type:    { name: "基本（答えを入力）", fields: ["表面", "裏面"] },
  cloze:   { name: "穴埋め（クローズ）", fields: ["テキスト", "補足"] },
  io:      { name: "画像穴埋め（イメージオクルージョン）", fields: ["画像", "見出し", "補足"] }
};
function typeKey(note){ return note.type === "anki" ? "m:" + note.mid : note.type; }
function fieldNamesFor(key){ if (String(key).startsWith("m:")) return S.models[key.slice(2)]?.fields || ["表面", "裏面"]; return (NOTE_TYPES[key] || NOTE_TYPES.basic).fields; }
function typeName(note){ return note.type === "anki" ? (S.models[note.mid]?.name || "Anki") : (NOTE_TYPES[note.type]?.name || note.type); }
let S = null;
function defaultState(){
  const did = "default";
  return { v: 1, savedAt: 0, nextPos: 1,
    decks: { [did]: { id: did, name: "デフォルト", opts: {}, collapsed: false } },
    notes: {}, cards: {}, revlog: [], media: {}, models: {},
    today: { day: -1, decks: {} },

function doneFor(did){ return S.today.decks[did] || (S.today.decks[did] = { n: 0, r: 0 }); }

  if (kind === "n"){ const dk = S.decks[did]; const extra = dk?.extra && dk.extra.day === S.today.day ? dk.extra.n : 0; return Math.max(0, o.newPerDay + extra - d.n); }

    const x = idx[c.did]; if (!x) continue;

function onStudyKey(e){

  if (tag === "input" || tag === "textarea" || tag === "select" || tgt.isContentEditable) return;

function typeDiff(given, correct){
  given = (given || "").trim(); correct = (correct || "").trim();
  if (!given) return `<div class="muted small">あなたの答え：（未入力）</div><div><span class="ok">${esc(correct)}</span></div>`;
  if (given === correct) return `<span class="ok">✓ ${esc(correct)}</span>`;
  const a = [...given], b = [...correct];
  if (a.length * b.length > 90000) return `<div><span class="bad">${esc(given)}</span></div><div>↓</div><div><span class="ok">${esc(correct)}</span></div>`;
  const dp = Array.from({ length: a.length + 1 }, () => new Uint16Array(b.length + 1));
  for (let i=a.length-1;i>=0;i--) for (let j=b.length-1;j>=0;j--) dp[i][j] = a[i] === b[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  let i=0, j=0, top = "", bot = "";
  while (i < a.length || j < b.length){
    if (i < a.length && j < b.length && a[i] === b[j]){ top += `<span class="ok">${esc(a[i])}</span>`; bot += `<span class="ok">${esc(b[j])}</span>`; i++; j++; }
    else if (j < b.length && (i >= a.length || dp[i][j+1] >= dp[i+1][j])){ top += `<span class="miss">-</span>`; bot += `<span class="miss">${esc(b[j])}</span>`; j++; }
    else { top += `<span class="bad">${esc(a[i])}</span>`; i++; }
  }
  return `<div>${top}</div><div class="muted">↓</div><div>${bot}</div>`;
}

}
function barChart(vals, labels, tipFn, tickFn){
  const W = 640, H = 170, padL = 30, padB = 22, padT = 8, w = W - padL - 6, hh = H - padB - padT;
  const max = Math.max(1, ...vals); const nice = max <= 5 ? 5 : Math.ceil(max / 5) * 5;
  const bw = w / vals.length;
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("role", "img");
  const el = (tag, at) => { const e = document.createElementNS(ns, tag); for (const k in at) e.setAttribute(k, at[k]); return e; };
  for (let i = 0; i <= 2; i++){ const v = nice * i / 2, y = padT + hh - v / nice * hh; svg.append(el("line", { x1: padL, x2: W - 6, y1: y, y2: y, class: "grid" })); const tx = el("text", { x: padL - 6, y: y + 3, "text-anchor": "end", class: "axis" }); tx.textContent = String(Math.round(v)); svg.append(tx); }
  const wrap = h("div", { class: "chart" }); const tip = h("div", { class: "tip" });
  vals.forEach((v, i) => {
    const bh = v / nice * hh, x = padL + i * bw + 2, y = padT + hh - bh, bwid = Math.max(2, bw - 4);
    if (v > 0){
      const r = Math.min(4, bwid/2, bh);
      const path = `M${x},${padT+hh} V${y + r} Q${x},${y} ${x + r},${y} H${x + bwid - r} Q${x + bwid},${y} ${x + bwid},${y + r} V${padT+hh} Z`;
      svg.append(el("path", { d: path, class: "bar" }));
    }
    const tk = tickFn(i); if (tk){ const tx = el("text", { x: x + bwid/2, y: H - 6, "text-anchor": "middle", class: "axis" }); tx.textContent = tk; svg.append(tx); }
    const hit = el("rect", { x: padL + i * bw, y: padT, width: bw, height: hh, class: "hit" });
    hit.addEventListener("mouseenter", () => { tip.style.display = "block"; tip.textContent = `${labels[i]}：${tipFn(v, i)}`; const rect = svg.getBoundingClientRect(), sc = rect.width / W; tip.style.left = ((x + bwid/2) * sc) + "px"; tip.style.top = (Math.min(y, padT + hh - 4) * sc) + "px"; });
    hit.addEventListener("mouseleave", () => tip.style.display = "none");
    svg.append(hit);
  });
  wrap.append(svg, tip);
  return wrap;
}

  offerFile(`${S.decks[did].name.replace(/::/g, "_")}.txt`, lines.join("\n"), "text/plain");
}
async function resetAll(){
  if (!await confirmDlg("すべてのデッキ・カード・学習履歴を削除します。元に戻せません。先にバックアップを書き出すことをおすすめします。", "すべて削除", true)) return;
  const conf = S.conf; S = defaultState(); S.conf.theme = conf.theme; rollover(); markDirty(); go("decks"); toast("削除しました");
}
function addSamples(){
  const did = ensureDeck("サンプル");
  const samples = [
    ["basic", ["日本の首都は？", "東京"], ["サンプル"]],
    ["reverse", ["apple", "りんご"], ["サンプル", "英単語"]],
    ["cloze", ["光合成は {{c1::葉緑体}} で行われ、{{c2::二酸化炭素::気体}} と水から糖をつくる。", "植物の細胞小器官"], ["サンプル"]],
    ["type", ["水の化学式を入力", "H2O"], ["サンプル"]],
    ["basic", ["<b>間隔反復</b>とは？", "覚えたことを忘れかける頃に復習し、復習の間隔を少しずつ延ばしていく学習法"], ["サンプル"]]
  ];
  for (const [t, f, tg] of samples) addNote(t, f, tg, did);
  markDirty(); toast("サンプルデッキを追加しました"); route(true);
}

rollover(); applyTheme();
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);
route(true);
initCloud();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("service-worker.js").catch(() => {});
